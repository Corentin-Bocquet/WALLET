# ============================================================================
# WALLET · Configuration du projet Supabase
# Utilisée par la CLI (`supabase start`, `supabase db reset`, `supabase deploy`)
# ============================================================================

project_id = "wallet"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# Une page de 1000 lignes suffit largement : les écrans paginent, et une
# limite haute ouvrirait la porte à des requêtes coûteuses.
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8099/index.html"
additional_redirect_urls = ["http://localhost:8099/index.html"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
# Mot de passe : 8 caractères minimum, cohérent avec la validation du client.
[auth.email.template.invite]

[storage]
enabled = true
file_size_limit = "10MiB"

# ---------------------------------------------------------------------------
# Edge Functions
#   verify_jwt = true partout SAUF pour les fonctions déclenchées par le
#   planificateur, qui s'authentifient par un secret d'en-tête (CRON_SECRET)
#   parce qu'elles n'ont pas de session utilisateur.
# ---------------------------------------------------------------------------

[functions.credentials-store]
verify_jwt = true

[functions.kraken-sync]
verify_jwt = true

[functions.okx-sync]
verify_jwt = true

[functions.market-sync]
# Référentiel public, partagé : pas de données personnelles, et le
# planificateur doit pouvoir l'appeler sans session.
verify_jwt = false

[functions.portfolio-snapshot]
verify_jwt = false

[functions.alerts-run]
verify_jwt = false
