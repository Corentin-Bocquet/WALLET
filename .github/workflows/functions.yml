name: Déploiement des fonctions

# Déploie les Edge Functions Supabase à chaque changement sur main.
# Sans ce workflow, une correction côté serveur (synchronisation Kraken,
# assistant IA…) restait dans le dépôt sans jamais atteindre l'application.
#
# À configurer UNE FOIS dans Settings → Secrets and variables → Actions :
#   SUPABASE_ACCESS_TOKEN  jeton personnel (supabase.com → Account → Access Tokens)
#   SUPABASE_PROJECT_REF   identifiant du projet (l'URL https://<ref>.supabase.co)
# Tant qu'ils manquent, le workflow ne fait rien et le dit.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la configuration
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN ou SUPABASE_PROJECT_REF absent : déploiement ignoré."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.skip != '1'
        with:
          version: latest

      # Mêmes options que docs/INSTALLATION.md : les fonctions appelées par le
      # planificateur (secret partagé) n'exigent pas de jeton utilisateur.
      - name: Déployer
        if: steps.check.outputs.skip != '1'
        run: |
          set -e
          for fn in credentials-store kraken-sync okx-sync ai-assistant ai-categorize; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done
          for fn in market-sync portfolio-snapshot alerts-run; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt
          done
